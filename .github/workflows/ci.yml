name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate JSON Schema syntax
        run: jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema"' schemas/test-suite.schema.json
      - name: Run validator self-test
        run: python3 scripts/validate_suite.py --self-test
